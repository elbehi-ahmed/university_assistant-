security:
    # Password hashers
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # User provider — loads User by email from the DB
    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    # Firewall configuration
    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        main:
            lazy: true
            provider: app_user_provider

            # Form login — Symfony Security handles POST /login automatically
            form_login:
                login_path: app_login
                check_path: app_login
                username_parameter: email
                password_parameter: password
                default_target_path: /
                enable_csrf: true

            # Logout
            logout:
                path: app_logout
                target: app_login

            # Remember me (optional — remove if not needed)
            # remember_me:
            #     secret: '%kernel.secret%'
            #     lifetime: 604800 # 1 week

    # Role hierarchy — admin > teacher, student both extend user
    role_hierarchy:
        ROLE_STUDENT: ROLE_USER
        ROLE_TEACHER: ROLE_USER
        ROLE_ADMIN:   [ROLE_TEACHER, ROLE_STUDENT]

    # Access control — restrict URL prefixes to the correct roles
    access_control:
        - { path: ^/login,    roles: PUBLIC_ACCESS }
        - { path: ^/register, roles: PUBLIC_ACCESS }
        - { path: ^/admin,    roles: ROLE_ADMIN }
        - { path: ^/teacher,  roles: ROLE_TEACHER }
        - { path: ^/student,  roles: ROLE_STUDENT }
        - { path: ^/,         roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
