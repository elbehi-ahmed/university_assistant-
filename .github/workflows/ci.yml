name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and start the stack (dev mode, with demo data)
        run: docker compose up -d --build --wait --wait-timeout 300

      - name: Validate composer.json / composer.lock
        run: docker compose exec -T app composer validate --no-check-publish

      - name: Lint Twig templates and the service container
        run: |
          docker compose exec -T app php bin/console lint:twig templates
          docker compose exec -T app php bin/console lint:container

      - name: Check the database schema matches the entities
        run: docker compose exec -T app php bin/console doctrine:schema:validate

      - name: Run PHPUnit
        run: docker compose exec -T app php bin/phpunit

      - name: Smoke-test the running app
        run: |
          for i in $(seq 1 30); do curl -sf http://localhost:8080/login >/dev/null && break; sleep 2; done
          curl -sf http://localhost:8080/login | grep -q 'name="email"'

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Production image builds
        run: docker build --target prod -t university-assistant:ci .
