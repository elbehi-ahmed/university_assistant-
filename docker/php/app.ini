expose_php = Off
; Expose container environment variables (DATABASE_URL, APP_SECRET…) to PHP
; under Apache, so they take precedence over the defaults in .env
variables_order = "EGPCS"
memory_limit = 256M
upload_max_filesize = 10M
post_max_size = 12M
date.timezone = Africa/Tunis

opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
realpath_cache_size = 4096K
realpath_cache_ttl = 600
